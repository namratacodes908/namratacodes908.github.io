<!DOCTYPE html>
<html>
<head>
<title>Namrata - My First Website</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#ff9a9e,#fecfef);min-height:100vh;display:flex;justify-content:center;align-items:center}
.card{background:white;padding:30px;border-radius:20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.2);max-width:350px;width:90%}
h1{color:#ff4b6e}
p{color:#555;line-height:1.6}
.btn{background:#ff4b6e;color:white;padding:12px 25px;border:none;border-radius:25px;font-size:16px;margin-top:15px;cursor:pointer}
.heart{font-size:40px;animation:beat 1s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
</style>
</head>
<body>
<div class="card">
<div class="heart">💖</div>
<h1>Hi, I'm Namrata!</h1>
<p>Welcome to my first website!</p>
<p>I made this myself on 9th September 2026.</p>
<p>My journey as a developer starts here ✨</p>
<button class="btn" onclick="alert('Thank you for visiting my website! - Namrata')">Say Hello</button>
<p style="margin-top:20px;font-size:12px;color:#999">namratacodes908.github.io</p>
</div>
</body>
</html>
